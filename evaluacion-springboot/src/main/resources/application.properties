spring.application.name=evaluacion-springboot

# ===== Base de datos MySQL =====
# createDatabaseIfNotExist=true crea la base "evaluacion" si todavía no existe
spring.datasource.url=jdbc:mysql://localhost:3306/evaluacion?createDatabaseIfNotExist=true&serverTimezone=America/Bogota
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== Errores =====
# Muestra el mensaje de error (ej: "No existe un cliente con id 9") en la respuesta JSON
server.error.include-message=always
server.error.include-binding-errors=always
